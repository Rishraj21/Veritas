[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-eng"
version = "0.1.0"
description = "Solver-independent analytical checks for engineering simulations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["simulation", "verification", "engineering", "CFD", "FEA"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.optional-dependencies]
test = ["pytest>=8"]
accelerated = ["numpy>=1.24", "scipy>=1.14"]
jit = ["numpy>=1.24", "scipy>=1.14", "numba>=0.60"]

[project.scripts]
veritas = "veritas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
