name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: veritas validate examples/passing.json

      - run: veritas validate examples/beam_units.csv --json
      - run: veritas validate examples/beam_units.json --json

      - run: python examples/radial_fvm.py

      - run: python examples/numerical_foundation.py

      - run: python examples/structured_solvers.py

  accelerated:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test,jit]'
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/browser.test.mjs tests/fluids.test.mjs tests/statics.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
